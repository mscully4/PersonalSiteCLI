[project]
name = "personal-site-cli"
version = "2.0.0"
description = "CLI for adding data to michaeljscully.com"
authors = [{ name = "mjscully" }]
requires-python = ">=3.12"

dependencies = [
    "attrs>=23.2",
    "boto3>=1.34",
    "boto3-stubs[dynamodb,s3]>=1.34",
    "rapidfuzz>=3.9",
    "googlemaps>=4.10",
    "numpy>=1.26",
    "pillow>=10.2",
    "pyfiglet>=1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "black>=24.1",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.8",
    "types-requests>=2.31",
]

# The source lives in ./personal-site-cli, whose name is not a valid Python
# identifier, and its modules import each other as top level names.  It is run
# as a script rather than installed, so uv manages the environment only.
[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
skip_glob = ["**/venv/*"]

# required for compatibility with black:
profile = "black"

# To maintain consistency with other settings
line_length = 100
